name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle wrapper jar
        run: base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        run: |
          set +e
          ./gradlew :core:test --stacktrace > /tmp/core-test.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "Gradle log tail:"
            tail -n 60 /tmp/core-test.log
            echo "---- publishing tail as annotations ----"
            tail -n 40 /tmp/core-test.log | sed 's/^/::error::/'
            exit $code
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
