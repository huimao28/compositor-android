name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle wrapper jar
        run: base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > /tmp/apk.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            { grep -A 8 "What went wrong" /tmp/apk.log; echo "====="; sed 's/\x1b\[[0-9;]*m//g' /tmp/apk.log | grep -m 25 "\.kt:"; } | head -n 50 | sed 's/^/::error::/'
            exit $code
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
